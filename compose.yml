services:
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_USE_CUDA=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks: [ kbnet ]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080" # UI: http://localhost:8080
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    cap_drop: [ "ALL" ]
    cap_add: [ "CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE" ]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }
    networks: [ kbnet ]

  tika:
    image: apache/tika:latest-full
    container_name: tika
    ports:
      - "9998:9998"
    restart: unless-stopped
    networks: [ kbnet ]

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: kb-postgres:16.4-pgvector
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
    ports: [ "5432:5432" ]
    volumes: [ "pg_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [ kbnet ]

  mongo:
    image: mongo:7
    ports: [ "27017:27017" ]
    volumes: [ "mongo_data:/data/db" ]
    networks: [ kbnet ]

volumes:
  pg_data: {}
  mongo_data: {}
  ollama: {}

networks:
  kbnet: {}
