name: CI

on:
  push:
    branches:
      - main
      - feature/rag-service
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - run: pnpm --filter web exec vitest run
        env:
          NEXTAUTH_URL: http://localhost:3001
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: test
          AUTH_SECRET: test-secret
          RAG_API_BASE: http://localhost:8000
          RAG_API_TOKEN: test-token

  playwright:
    runs-on: ubuntu-latest
    needs: vitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Start databases
        run: docker compose up -d postgres mongo
      - name: Wait for services
        run: pnpm dlx wait-on tcp:localhost:5432 tcp:localhost:27017
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Apply database migrations
        run: pnpm --filter web exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://kb:kb@localhost:5432/kb
      - run: pnpm --filter web exec prisma generate
      - run: pnpm --filter web exec -- playwright install --with-deps
      - run: pnpm --filter web exec -- playwright test --reporter=list
        env:
          DATABASE_URL: postgresql://kb:kb@localhost:5432/kb
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: kbapp
          NEXTAUTH_SECRET: test-nextauth-secret
          NEXTAUTH_URL: http://localhost:3001
          RAG_API_BASE: http://localhost:8000
          RAG_API_TOKEN: ci-token
          RAG_POSTGRES_DSN: postgresql://kb:kb@localhost:5432/kb
          RAG_MONGODB_URI: mongodb://localhost:27017
          RAG_MONGO_DB: kbapp
          RAG_ENABLE_FALLBACK_EMBEDDINGS: "true"
          RAG_SYNC_SERVICE_TOKEN: ci-token
          PLAYWRIGHT_TEST_KB_ID: 00000000-0000-4000-8000-000000000000
          USE_RAG_MOCK: "false"
          E2E_USE_RAG_MOCK: "false"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv run pytest tests/test_models_api.py
        working-directory: services/rag-api
